# @claude で呼ぶ対話モード。Issue・PR のコメントで頼んだことを、その場で答えるか直して push する
# 認証は CLAUDE_CODE_OAUTH_TOKEN（claude setup-token）。API キーなら anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} に替える
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # PR の CI の結果を読む
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
        with:
          chromium: 'true'
      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(pnpm:*),Bash(git:*),Bash(gh:*),Bash(node design/tools/*),Bash(touch:*),Bash(ls:*),Bash(cat:*)"
