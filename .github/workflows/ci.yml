# 型・lint・書式・テスト（ストーリーの描画、play、見た目の回帰）を確かめる
# 見た目の基準画像は Linux の Chromium で撮っているので、ubuntu で走らせる
name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        # Uses the version from the "packageManager" field in package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependency
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Test
        run: pnpm test
      - name: Upload screenshot diffs
        # 見た目がずれたときの実際の画像と差分（.vitest-attachments）
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-diffs
          path: .vitest-attachments
          if-no-files-found: ignore
          # .vitest-attachments は隠しディレクトリなので、これがないと空になる
          include-hidden-files: true
