# PR ごとの Storybook を artifact に上げる。最終レビューで、ブランチを手元に取らずに見るため
# （zip を落として docs/ を開く。Pages に pr/<番号>/ で置く形は、Pages の出し方を変えるときに検討する）
name: Storybook preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: storybook-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-pr-${{ github.event.pull_request.number }}
          path: docs
