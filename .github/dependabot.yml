version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
          - 'storybook-addon-pseudo-states'
      vite:
        patterns:
          - 'vite'
          - '@vitejs/plugin-react'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'playwright'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      oxc:
        patterns:
          - 'oxfmt'
          - 'oxlint'
          - 'oxlint-tsgolint'
      shiki:
        patterns:
          - 'shiki'
          - '@shikijs/*'
      fontsource:
        patterns:
          - '@fontsource/*'
          - '@fontsource-variable/*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Tokyo'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      actions:
        patterns:
          - '*'
