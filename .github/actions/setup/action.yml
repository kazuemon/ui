# pnpm・Node・依存の段取り。ci.yml と同じ手順を、Claude のワークフローから使い回す
name: Setup
description: pnpm と Node を用意し、依存を入れる。chromium を true にすると Playwright の Chromium も入れる
inputs:
  chromium:
    description: テストと撮影のために Chromium を入れるか
    default: 'false'
runs:
  using: composite
  steps:
    - name: Setup pnpm
      # Uses the version from the "packageManager" field in package.json
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Setup node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: 'pnpm'
    - name: Install dependency
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Install Chromium
      if: inputs.chromium == 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps --only-shell chromium
